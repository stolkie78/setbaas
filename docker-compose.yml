services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: setbaas-pb
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb_data
      - ./pb_migrations:/pb/pb_migrations
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  pb-setup:
    image: alpine:3.19
    container_name: setbaas-pb-setup
    depends_on:
      pocketbase:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "-c"]
    command:
      - |
        apk add --no-cache curl jq docker-cli > /dev/null 2>&1
        docker exec setbaas-pb pocketbase superuser upsert "$$PB_ADMIN_EMAIL" "$$PB_ADMIN_PASSWORD" 2>/dev/null || true
        sh /scripts/setup-collections.sh http://pocketbase:8090
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      - SETBAAS_ADMIN_EMAIL=${SETBAAS_ADMIN_EMAIL:-}
      - SETBAAS_ADMIN_PASSWORD=${SETBAAS_ADMIN_PASSWORD:-}
    restart: "no"
    profiles: ["setup"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: setbaas-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_POCKETBASE_URL=http://pocketbase:8090
      - ORIGIN=http://localhost:3000
      - BODY_SIZE_LIMIT=104857600
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@setbaas.nl}
    depends_on:
      pocketbase:
        condition: service_healthy
