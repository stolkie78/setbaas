# SetBaas Demo Environment
# Configure via .env.demo file:
#   SITE_URL=https://demo.setbaas.nl
#   PB_ADMIN_EMAIL=...
#   PB_ADMIN_PASSWORD=...
#
# Usage:
#   docker compose -p setbaas-demo -f docker-compose.demo.yml --env-file .env.demo up -d --build
#   docker compose -p setbaas-demo -f docker-compose.demo.yml --env-file .env.demo --profile setup run --rm pb-setup

name: setbaas-demo

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: setbaas-demo-pb
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - ./pb_data_demo:/pb_data
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default
      - caddy-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: setbaas-demo-frontend:latest
    container_name: setbaas-demo-frontend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.demo
    environment:
      - PUBLIC_POCKETBASE_URL=${SITE_URL:-https://demo.setbaas.nl}
      - ORIGIN=${SITE_URL:-https://demo.setbaas.nl}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - default
      - caddy-net

  pb-setup:
    image: alpine:3.19
    container_name: setbaas-demo-pb-setup
    depends_on:
      pocketbase:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env.demo
    entrypoint: ["sh", "-c"]
    command:
      - |
        apk add --no-cache curl jq docker-cli > /dev/null 2>&1
        docker exec setbaas-demo-pb pocketbase superuser upsert "$$PB_ADMIN_EMAIL" "$$PB_ADMIN_PASSWORD" 2>/dev/null || true
        sh /scripts/setup-collections.sh http://pocketbase:8090
    restart: "no"
    profiles: ["setup"]
    networks:
      - default

networks:
  default:
    name: setbaas-demo-net
  caddy-net:
    external: true