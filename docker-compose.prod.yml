# SetBaas Production/Server Environment
# Configure via .env file:
#   DOMAIN=setbaas.nl        (your domain or hostname)
#   ENABLE_SSL=true          (true = HTTPS via Let's Encrypt, false = HTTP only)
#   HTTP_PORT=80             (optional, default 80)
#.  Caddy already running as global service on production
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml --profile setup run --rm pb-setup



services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: setbaas-pb
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - ./pb_data:/pb_data
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default
      - caddy-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: setbaas-frontend:latest
    container_name: setbaas-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PUBLIC_POCKETBASE_URL=${SITE_URL:-http://localhost}
      - ORIGIN=${SITE_URL:-http://localhost}
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@setbaas.nl}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - default
      - caddy-net

pb-setup:
    image: alpine:3.19
    container_name: setbaas-demo-pb-setup
    depends_on:
      pocketbase:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env.demo
    entrypoint: ["sh", "-c"]
    command:
      - |
        apk add --no-cache curl jq docker-cli > /dev/null 2>&1
        docker exec setbaas-demo-pb pocketbase superuser upsert "$$PB_ADMIN_EMAIL" "$$PB_ADMIN_PASSWORD" 2>/dev/null || true
        sh /scripts/setup-collections.sh http://pocketbase:8090
    restart: "no"
    profiles: ["setup"]
    networks:
      - default

networks:
  default:
  caddy-net:
    external: true