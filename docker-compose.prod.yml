# SetBaas Production/Server Environment
# Configure via .env file:
#   DOMAIN=setbaas.nl        (your domain or hostname)
#   ENABLE_SSL=true          (true = HTTPS via Let's Encrypt, false = HTTP only)
#   HTTP_PORT=80             (optional, default 80)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml --profile setup run --rm pb-setup

services:
  caddy:
    image: caddy:2-alpine
    container_name: setbaas-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./scripts/generate-caddyfile.sh:/generate-caddyfile.sh:ro
      - ./caddy/conf.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ENABLE_SSL=${ENABLE_SSL:-false}
    entrypoint: ["/bin/sh", "-c", "sh /generate-caddyfile.sh > /etc/caddy/Caddyfile && caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    depends_on:
      - frontend
      - pocketbase

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: setbaas-pb
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - ./pb_data:/pb_data
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: setbaas-frontend:latest
    container_name: setbaas-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PUBLIC_POCKETBASE_URL=${SITE_URL:-http://localhost}
      - ORIGIN=${SITE_URL:-http://localhost}
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@setbaas.nl}
    depends_on:
      pocketbase:
        condition: service_healthy

  pb-setup:
    image: alpine:3.19
    container_name: setbaas-pb-setup
    depends_on:
      pocketbase:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "-c"]
    command:
      - |
        apk add --no-cache curl jq docker-cli > /dev/null 2>&1
        docker exec setbaas-pb pocketbase superuser upsert "$$PB_ADMIN_EMAIL" "$$PB_ADMIN_PASSWORD" 2>/dev/null || true
        sh /scripts/setup-collections.sh http://pocketbase:8090
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SITE_URL=${SITE_URL:-}
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      - SETBAAS_ADMIN_EMAIL=${SETBAAS_ADMIN_EMAIL:-}
      - SETBAAS_ADMIN_PASSWORD=${SETBAAS_ADMIN_PASSWORD:-}
    restart: "no"
    profiles: ["setup"]

volumes:
  caddy_data:
  caddy_config:
